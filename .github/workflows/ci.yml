name: ci

# Install, test, build. Replace the commands with the stack's own; keep the
# structure. The house-style check is a separate workflow, so that a failure
# of the standard is visibly different from a failure of the code.

on:
  # Every branch, because the default branch of a repository in this
  # collection is not always main: most are on master, and one is on prod.
  # A filter on main would mean the check never ran.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Replace this block with the stack's toolchain.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        # Mirrors the Dockerfile; the tests import numpy for the ASR helpers.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir -r requirements.txt

      - name: Test
        run: python3 -m unittest discover -s tests -t .

      - name: Build
        # No wheel to build: the real build is the Docker image. Byte-compile
        # the sources as the closest quick check.
        run: python3 -m compileall -q app scripts
